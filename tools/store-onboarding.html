<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu thông tin cửa hàng</title>
<style>
:root{
  --bg:#fbf7f5; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e6dfdb;
  --brand:#d6336c; --brand-ink:#ffffff; --ok:#1b7f4c; --warn:#a15c00; --chip:#f4ecee; --focus:#d6336c33;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1e2127; --ink:#e8eaed; --muted:#9aa1ab; --line:#32363e;
    --brand:#f06292; --brand-ink:#16181c; --ok:#58c58c; --warn:#e0a24a; --chip:#2a2e36; --focus:#f0629244;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1e2127; --ink:#e8eaed; --muted:#9aa1ab; --line:#32363e;
  --brand:#f06292; --brand-ink:#16181c; --ok:#58c58c; --warn:#e0a24a; --chip:#2a2e36; --focus:#f0629244;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
main{max-width:980px;margin:0 auto;padding:8px 16px 96px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar-in{max-width:980px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-left:6px;vertical-align:middle}
.tab .dot.done{background:var(--ok)}
button.act{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
button.sec{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card h2{font-size:17px;margin:0 0 4px}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.info{background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.info b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f span.t{display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:76px;resize:vertical}
.hexrow{display:flex;gap:8px;align-items:center}
.hexrow input[type=color]{width:42px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.hexrow input[type=color].empty{background:repeating-linear-gradient(45deg,var(--line) 0 4px,var(--bg) 4px 8px);color-scheme:normal}
.hexrow input[type=color].empty::-webkit-color-swatch{opacity:0}
.hexrow input[type=color].empty::-moz-color-swatch{opacity:0}
input[aria-invalid=true]{border-color:var(--warn)}
.sug{font-size:12px;color:var(--muted);margin-top:3px}
.sug button{border:0;background:none;color:var(--brand);cursor:pointer;padding:0 0 0 4px;font:inherit;text-decoration:underline}
.assetrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;border-top:1px dashed var(--line);padding:10px 0}
.assetrow:first-of-type{border-top:0}
.file-meta{font-size:12px;color:var(--muted);word-break:break-all;margin-top:4px}
.zone{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.check input{margin-top:4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--muted)}
.warn{color:var(--warn)}
.mock{max-width:720px;margin:8px 0 4px}
.mock svg{width:100%;height:auto;display:block}
.mk-fix{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.6}
.mk-free{fill:#eeedfe;stroke:#534ab7;stroke-width:.6}
.mk-box{fill:var(--bg);stroke:var(--line);stroke-width:.8}
.mk-dash{fill:none;stroke:var(--muted);stroke-width:.6;stroke-dasharray:4 3}
.mt{font:500 13px system-ui,sans-serif;fill:#26215c;pointer-events:none}
.mtf{font:500 13px system-ui,sans-serif;fill:#04342c;pointer-events:none}
.ms{font:12px system-ui,sans-serif;fill:var(--muted)}
.mn{font:500 12px system-ui,sans-serif;fill:var(--ink)}
.mk-lead{stroke:var(--muted);stroke-width:.6;stroke-dasharray:3 3}
.mk-arr{stroke:#534ab7;stroke-width:1.5;fill:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mk-fix{fill:#085041;stroke:#9fe1cb}:root:not([data-theme="light"]) .mk-free{fill:#3c3489;stroke:#afa9ec}:root:not([data-theme="light"]) .mt{fill:#cecbf6}:root:not([data-theme="light"]) .mtf{fill:#9fe1cb}:root:not([data-theme="light"]) .mk-arr{stroke:#afa9ec}}
:root[data-theme="dark"] .mk-fix{fill:#085041;stroke:#9fe1cb}:root[data-theme="dark"] .mk-free{fill:#3c3489;stroke:#afa9ec}:root[data-theme="dark"] .mt{fill:#cecbf6}:root[data-theme="dark"] .mtf{fill:#9fe1cb}:root[data-theme="dark"] .mk-arr{stroke:#afa9ec}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid}
.legend .a{background:#e1f5ee;border-color:#0f6e56}.legend .b{background:#eeedfe;border-color:#534ab7}
.split{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:24px;position:relative;align-items:start;margin-top:8px}
.split .left{position:sticky;top:64px}
.split .right{min-width:0}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--card)}
.grp h4{margin:0 0 2px;font-size:15px}
.grp .note{margin-bottom:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 4px 0 0}
.seg{display:flex;gap:0;margin-top:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mock-note{font-size:12px;color:var(--muted);margin-top:6px}
.mock [data-comp].hl rect{stroke-width:2.2}
.mock{max-width:420px}
@media (max-width:899px){.split{grid-template-columns:1fr;gap:16px}.split .left{position:static}}
@media (max-width:560px){.assetrow{grid-template-columns:1fr}.zone{grid-template-columns:repeat(2,1fr)}}
</style>

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){
    if(k==="class") e.className = attrs[k];
    else if(k==="text") e.textContent = attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 3200);

function renderTabs(){

  all.forEach(function(s){
    var b = el("button",{class:"tab",role:"tab",type:"button","data-code":s.code,"aria-selected":String(s.code===current),

function updateDots(){

function renderMain(){

  else m.appendChild(renderStore(STORES.filter(function(s){return s.code===current;})[0]));

function applyPrefill(){
  Object.keys(PREFILL2).forEach(function(code){
    var d = sget(code), p = PREFILL2[code];
    if(d.prefill2 === PREFILL2_SRC) return;
    var upgrade = !!d.prefill2;
    ["hotline","address","logoTone","logoPos","franchiseType"].forEach(function(k){ if(p[k] && !d[k]) d[k] = p[k]; });
    if(!d.lang || (upgrade && d.lang === "en")) d.lang = p.lang;
    var old = d.prefill2NoteText;
    var legacy = "Từ poster AK gửi ngày 01/11/2026, chưa phải nguồn xác nhận:";
    var li = d.note ? d.note.indexOf(legacy) : -1;
    if(!old && li >= 0){ var le = d.note.indexOf("\n\n", li); d.note = (d.note.slice(0, li) + (le >= 0 ? d.note.slice(le + 2) : "")).trim(); }
    if(old && d.note && d.note.indexOf(old) >= 0) d.note = d.note.replace(old, function(){ return p.note; });
    else d.note = (d.note ? d.note + "\n\n" : "") + p.note;
    d.prefill2NoteText = p.note; d.prefill2 = PREFILL2_SRC;
  });
  var hq = state.general.hq = state.general.hq || {}; hq.colors = hq.colors || {}; hq.fonts = hq.fonts || {};
  Object.keys(HQ_DEFAULT.colors).forEach(function(k){ if(!hq.colors[k]) hq.colors[k] = HQ_DEFAULT.colors[k]; });
  Object.keys(HQ_DEFAULT.fonts).forEach(function(k){ if(!hq.fonts[k]) hq.fonts[k] = HQ_DEFAULT.fonts[k]; });
  if(!hq.logoTone) hq.logoTone = HQ_DEFAULT.logoTone;
  Object.keys(DEFAULT_TONE).forEach(function(code){ var d = sget(code); if(!d.logoTone) d.logoTone = DEFAULT_TONE[code]; });
  Object.keys(DEFAULT_TYPE).forEach(function(code){ var d = sget(code); if(!d.franchiseType) d.franchiseType = DEFAULT_TYPE[code]; });
  Object.keys(DEFAULT_KIND).forEach(function(code){ var d = sget(code); if(!d.posterKind) d.posterKind = DEFAULT_KIND[code]; });
  Object.keys(DEFAULT_POS).forEach(function(code){ var d = sget(code); if(!d.logoPos) d.logoPos = DEFAULT_POS[code]; });
  Object.keys(PREFILL).forEach(function(code){
    var d = sget(code), p = PREFILL[code];
    if(d.prefillApplied) return;
    ["brandName","hotline","address","fanpage","services","note"].forEach(function(k){ if(p[k] && !d[k]) d[k] = p[k]; });
    Object.keys(p.colors||{}).forEach(function(k){ if(!d.colors[k]) d.colors[k] = p.colors[k]; });
    Object.keys(p.fonts||{}).forEach(function(k){ if(!d.fonts[k]) d.fonts[k] = p.fonts[k]; });
    d.prefillApplied = PREFILL_SRC;
  });
}
function collect(){
  var out = {schema:"ao-may-store-onboarding", version:APP_VERSION, savedAt:new Date().toISOString(), general:state.general, stores:{}};
  STORES.forEach(function(s){ var d = sget(s.code); out.stores[s.code] = Object.assign({name:s.name, currentStatus:s.status, currentRoute:s.route}, JSON.parse(JSON.stringify(d)));
    var H = state.general.hq || {}, inh = d.franchiseType === "inherit";
    out.stores[s.code].effective = inh ? {source:"trụ sở gốc", colors:JSON.parse(JSON.stringify(H.colors||{})), fonts:JSON.parse(JSON.stringify(H.fonts||{})), logoTone:H.logoTone||""} : {source:"cửa hàng", colors:JSON.parse(JSON.stringify(d.colors||{})), fonts:JSON.parse(JSON.stringify(d.fonts||{})), logoTone:d.logoTone||""}; });
  return out;
}
function stamp(){ var n=new Date(),p=function(x){return String(x).padStart(2,"0");}; return n.getFullYear()+p(n.getMonth()+1)+p(n.getDate())+"-"+p(n.getHours())+p(n.getMinutes()); }
async function saveBlob(text, name, type){
  var blob = new Blob([text],{type:type});
  if(window.showSaveFilePicker){
    try{
      var ext = name.split(".").pop();
      var h = await window.showSaveFilePicker({suggestedName:name, types:[{description:ext.toUpperCase(), accept:{[type]:["."+ext]}}]});
      var w = await h.createWritable(); await w.write(blob); await w.close(); toast("Đã lưu "+h.name); return;
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  var a = el("a",{href:URL.createObjectURL(blob),download:name}); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000); toast("Đã tải về "+name+" (thư mục Tải xuống)");
}
function mdEscape(s){ return String(s==null?"":s).replace(/\|/g,"\\|").replace(/\n/g,"<br>"); }
function toMarkdown(){
  var d = collect(), L = [];

  if(d.general.note) L.push("- Ghi chú: "+d.general.note);
  var H = d.general.hq || {}, hcs = H.colors || {}, hfs = H.fonts || {};
  L.push("","### B. Nhận diện trụ sở gốc Áo Mây (cho DQH, TH, CH, TP, NX)","","- Màu logo: "+({dark:"tối (nền sáng)",light:"sáng (nền đậm)",mixed:"hỗn hợp"})[H.logoTone||""],"- Màu chính "+(hcs.primary||"")+" · bổ trợ "+(hcs.secondary||"")+" · chữ chính "+(hcs.textPrimary||"")+" · chữ phụ "+(hcs.textSecondary||"")+" · nền "+(hcs.background||"")+" · nhấn "+(hcs.accent||""),"- Font tiêu đề "+(hfs.headingName||"")+" · font nội dung "+(hfs.bodyName||""));
  L.push("");
  STORES.forEach(function(s){
    var x = d.stores[s.code];
    L.push("## "+s.code+" — "+s.name,"","Hiện trạng: "+s.status+" · route "+s.route+" · "+(x.confirmed?"**đã xác nhận**":"chưa xác nhận"),"");
    L.push("| Mục | Giá trị |","|---|---|");
    L.push("| Tên hiển thị | "+mdEscape(x.brandName)+" |","| Hotline | "+mdEscape(x.hotline)+" |","| Địa chỉ | "+mdEscape(x.address)+" |","| Fanpage | "+mdEscape(x.fanpage)+" |","| Dịch vụ/chính sách | "+mdEscape(x.services)+" |");
    var eff = x.effective || {}, ec = eff.colors || x.colors || {}, ef = eff.fonts || x.fonts || {};
    L.push("| Nguồn màu, font | "+mdEscape(eff.source||"")+" |");
    COLORS.forEach(function(c){ L.push("| "+c[1]+" | "+mdEscape(ec[c[0]])+" |"); });
    [["heading","Font tiêu đề"],["body","Font nội dung"],["script","Font viết tay"]].forEach(function(f){
      var fl=(x.fonts||{})[f[0]+"File"]; L.push("| "+f[1]+" | "+mdEscape(ef[f[0]+"Name"])+(fl?" (file "+mdEscape(fl.name)+")":"")+" |");
    });
    ASSETS.forEach(function(a){ var v=(x.assets||{})[a[0]]||{}; L.push("| "+a[1]+" | "+mdEscape(v.mode||"")+(v.file?" — "+mdEscape(v.file.name)+" sha256 "+(v.file.sha256||"?"):"")+" |"); });
    L.push("| Màu logo | "+mdEscape(({dark:"tối (nền sáng)",light:"sáng (nền đậm)",mixed:"hỗn hợp"})[x.logoTone]||"")+(typeof x.logoLuma==="number"?" (đo "+x.logoLuma+")":"")+" |");
    L.push("| Dạng poster hay dùng | "+mdEscape(({compare:"so sánh (trước/sau)",hero:"không so sánh (một ảnh minh họa)",both:"cả hai dạng"})[x.posterKind]||"")+" |");
    L.push("| Loại nhượng quyền | "+mdEscape(({inherit:"giữ nguyên nhận diện trụ sở gốc",custom:"đổi nhận diện (màu sắc, logo riêng)"})[x.franchiseType]||"")+" |");
    L.push("| Mẫu đã duyệt | "+mdEscape((x.refs||[]).map(function(r){return r.name;}).join(", "))+" |");
    L.push("| Vị trí logo | "+mdEscape(({"top-left":"trên trái","top-center":"giữa","top-right":"trên phải"})[x.logoPos]||"")+" |","| Chừa đáy từ y | "+mdEscape(x.footerFromY)+" |","| Route | "+mdEscape(x.route)+" |","| Ngôn ngữ | "+mdEscape(x.lang)+" |","| Ghi chú | "+mdEscape(x.note)+" |","");
  });
  return L.join("\n");
}
function loadObj(o){
  if(!o||o.schema!=="ao-may-store-onboarding") throw new Error("Không phải file phiếu thông tin cửa hàng");
  state.general = o.general||{};
  STORES.forEach(function(s){ var src=(o.stores||{})[s.code]; if(src){ var c=JSON.parse(JSON.stringify(src)); delete c.name; delete c.currentStatus; delete c.currentRoute; c.colors=c.colors||{};c.fonts=c.fonts||{};c.assets=c.assets||{};c.refs=c.refs||[];delete c.zones;delete c.poster;delete c.effective; state.stores[s.code]=c; } });
}

function autosave(){ clearTimeout(_saveT); _saveT=setTimeout(function(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); }catch(e){} },400); }

document.getElementById("btnLoad").addEventListener("click",function(){ document.getElementById("fileLoad").click(); });

   .catch(function(e){ toast("Không mở được: "+e.message); });
  ev.target.value = "";
});
window.addEventListener("beforeunload",function(e){ try{ if(localStorage.getItem(DRAFT_KEY)){ /* bản nháp đã tự lưu trong trình duyệt */ } }catch(x){} });

(function init(){
  try{ var raw = localStorage.getItem(DRAFT_KEY); if(raw){ loadObj(JSON.parse(raw)); setTimeout(function(){ toast("Đã khôi phục bản nháp tự lưu trong trình duyệt"); },300); } }catch(e){}
  applyPrefill();

  window.__collect = collect; window.__md = toMarkdown;
})();
