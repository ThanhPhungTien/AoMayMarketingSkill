<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu thông tin cửa hàng</title>
<style>
:root{
  --bg:#fbf7f5; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e6dfdb;
  --brand:#d6336c; --brand-ink:#ffffff; --ok:#1b7f4c; --warn:#a15c00; --chip:#f4ecee; --focus:#d6336c33;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1e2127; --ink:#e8eaed; --muted:#9aa1ab; --line:#32363e;
    --brand:#f06292; --brand-ink:#16181c; --ok:#58c58c; --warn:#e0a24a; --chip:#2a2e36; --focus:#f0629244;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1e2127; --ink:#e8eaed; --muted:#9aa1ab; --line:#32363e;
  --brand:#f06292; --brand-ink:#16181c; --ok:#58c58c; --warn:#e0a24a; --chip:#2a2e36; --focus:#f0629244;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
main{max-width:980px;margin:0 auto;padding:8px 16px 96px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar-in{max-width:980px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-left:6px;vertical-align:middle}
.tab .dot.done{background:var(--ok)}
button.act{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
button.sec{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card h2{font-size:17px;margin:0 0 4px}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.info{background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.info b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f span.t{display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:76px;resize:vertical}
.hexrow{display:flex;gap:8px;align-items:center}
.hexrow input[type=color]{width:42px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.hexrow input[type=color].empty{background:repeating-linear-gradient(45deg,var(--line) 0 4px,var(--bg) 4px 8px);color-scheme:normal}
.hexrow input[type=color].empty::-webkit-color-swatch{opacity:0}
.hexrow input[type=color].empty::-moz-color-swatch{opacity:0}
input[aria-invalid=true]{border-color:var(--warn)}
.sug{font-size:12px;color:var(--muted);margin-top:3px}
.sug button{border:0;background:none;color:var(--brand);cursor:pointer;padding:0 0 0 4px;font:inherit;text-decoration:underline}
.assetrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;border-top:1px dashed var(--line);padding:10px 0}
.assetrow:first-of-type{border-top:0}
.file-meta{font-size:12px;color:var(--muted);word-break:break-all;margin-top:4px}
.zone{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.check input{margin-top:4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--muted)}
.warn{color:var(--warn)}
.mock{max-width:720px;margin:8px 0 4px}
.mock svg{width:100%;height:auto;display:block}
.mk-fix{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.6}
.mk-free{fill:#eeedfe;stroke:#534ab7;stroke-width:.6;cursor:pointer}
.mk-free:hover{stroke-width:1.4}
.mk-box{fill:var(--bg);stroke:var(--line);stroke-width:.8}
.mk-dash{fill:none;stroke:var(--muted);stroke-width:.6;stroke-dasharray:4 3}
.mt{font:500 13px system-ui,sans-serif;fill:#26215c;pointer-events:none}
.mtf{font:500 13px system-ui,sans-serif;fill:#04342c;pointer-events:none}
.ms{font:12px system-ui,sans-serif;fill:var(--muted)}
.mn{font:500 12px system-ui,sans-serif;fill:var(--ink)}
.mk-lead{stroke:var(--muted);stroke-width:.6;stroke-dasharray:3 3}
.mk-arr{stroke:#534ab7;stroke-width:1.5;fill:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mk-fix{fill:#085041;stroke:#9fe1cb}:root:not([data-theme="light"]) .mk-free{fill:#3c3489;stroke:#afa9ec}:root:not([data-theme="light"]) .mt{fill:#cecbf6}:root:not([data-theme="light"]) .mtf{fill:#9fe1cb}:root:not([data-theme="light"]) .mk-arr{stroke:#afa9ec}}
:root[data-theme="dark"] .mk-fix{fill:#085041;stroke:#9fe1cb}:root[data-theme="dark"] .mk-free{fill:#3c3489;stroke:#afa9ec}:root[data-theme="dark"] .mt{fill:#cecbf6}:root[data-theme="dark"] .mtf{fill:#9fe1cb}:root[data-theme="dark"] .mk-arr{stroke:#afa9ec}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid}
.legend .a{background:#e1f5ee;border-color:#0f6e56}.legend .b{background:#eeedfe;border-color:#534ab7}
@media (max-width:560px){.assetrow{grid-template-columns:1fr}.zone{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){
    if(k==="class") e.className = attrs[k];
    else if(k==="text") e.textContent = attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 3200);
}

async function sha256(file){
  try{
    var buf = await file.arrayBuffer();
    var d = await crypto.subtle.digest("SHA-256", buf);
    return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){ return ""; }
}

  return el("div",{},[inp,meta]);
}

      var fl=(x.fonts||{})[f[0]+"File"]; L.push("| "+f[1]+" | "+mdEscape((x.fonts||{})[f[0]+"Name"])+(fl?" (file "+mdEscape(fl.name)+")":"")+" |");
    });
    ASSETS.forEach(function(a){ var v=(x.assets||{})[a[0]]||{}; L.push("| "+a[1]+" | "+mdEscape(v.mode||"")+(v.file?" — "+mdEscape(v.file.name)+" sha256 "+(v.file.sha256||"?"):"")+" |"); });
    L.push("| Mẫu đã duyệt | "+mdEscape((x.refs||[]).map(function(r){return r.name;}).join(", "))+" |");
    var p = x.poster||{}; var bens = (p.benefits||[]).filter(function(b){return b&&(b.title||b.desc);}).map(function(b){return (b.title||"")+(b.desc?" — "+b.desc:"");}).join("; ");
    L.push("| Poster: tiêu đề | "+mdEscape([p.headline1,p.headline2].filter(Boolean).join(" / "))+" |","| Poster: dải phụ | "+mdEscape(p.subline)+" |","| Poster: nhãn trước/sau | "+mdEscape([p.beforeLabel,p.afterLabel].filter(Boolean).join(" / "))+" |","| Poster: lợi ích | "+mdEscape(bens)+" |","| Poster: khối đáy | "+mdEscape(p.block)+" |");
    var z = x.zones||{}; L.push("| Vùng logo | "+mdEscape([z.x0,z.y0,z.x1,z.y1].join(", "))+" |","| Chừa đáy từ y | "+mdEscape(x.footerFromY)+" |","| Route | "+mdEscape(x.route)+" |","| Ngôn ngữ | "+mdEscape(x.lang)+" |","| Ghi chú | "+mdEscape(x.note)+" |","");
  });
  return L.join("\n");
}
function loadObj(o){
  if(!o||o.schema!=="ao-may-store-onboarding") throw new Error("Không phải file phiếu thông tin cửa hàng");
  state.general = o.general||{};
  STORES.forEach(function(s){ var src=(o.stores||{})[s.code]; if(src){ var c=JSON.parse(JSON.stringify(src)); delete c.name; delete c.currentStatus; delete c.currentRoute; c.colors=c.colors||{};c.fonts=c.fonts||{};c.assets=c.assets||{};c.refs=c.refs||[];c.zones=c.zones||{};c.poster=c.poster||blankPoster(); state.stores[s.code]=c; } });
}
var _saveT;
function autosave(){ clearTimeout(_saveT); _saveT=setTimeout(function(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); }catch(e){} },400); }

document.getElementById("btnSave").addEventListener("click",function(){ saveBlob(JSON.stringify(collect(),null,2),"ao-may-store-onboarding_"+stamp()+".json","application/json"); });
document.getElementById("btnMd").addEventListener("click",function(){ saveBlob(toMarkdown(),"ao-may-store-onboarding_"+stamp()+".md","text/markdown"); });
document.getElementById("btnLoad").addEventListener("click",function(){ document.getElementById("fileLoad").click(); });
document.getElementById("fileLoad").addEventListener("change",function(ev){
  var f = ev.target.files[0]; if(!f) return;
  f.text().then(function(t){ loadObj(JSON.parse(t)); renderTabs(); renderMain(); toast("Đã mở "+f.name); })
   .catch(function(e){ toast("Không mở được: "+e.message); });
  ev.target.value = "";
});
window.addEventListener("beforeunload",function(e){ try{ if(localStorage.getItem(DRAFT_KEY)){ /* bản nháp đã tự lưu trong trình duyệt */ } }catch(x){} });

(function init(){
  try{ var raw = localStorage.getItem(DRAFT_KEY); if(raw){ loadObj(JSON.parse(raw)); setTimeout(function(){ toast("Đã khôi phục bản nháp tự lưu trong trình duyệt"); },300); } }catch(e){}
  applyPrefill();
  renderTabs(); renderMain();
  window.__collect = collect; window.__md = toMarkdown;
})();
</script>
